version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: wnr-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      # Node.js optimization flags for better performance
      - NODE_OPTIONS=--max-old-space-size=512 --enable-source-maps
    env_file:
      - ./backend/.env
    volumes:
      # Mount logs directory for persistence
      - ./backend/logs:/app/logs
    networks:
      - wnr-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=false"

  # Frontend Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: runner
    container_name: wnr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=512
    env_file:
      - ./client/.env.local
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wnr-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=false"

  # Admin UI Service
  adminui:
    build:
      context: ./adminui
      dockerfile: Dockerfile
      target: runner
    container_name: wnr-adminui
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=512
    env_file:
      - ./adminui/.env.local
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wnr-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=false"

  # Nginx Reverse Proxy (Optional but recommended)
  nginx:
    image: nginx:alpine
    container_name: wnr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - wnr-network
    labels:
      - "traefik.enable=false"

networks:
  wnr-network:
    driver: bridge
